# @package _global_

defaults:
  - override /data: curly_flow_pifm.yaml
  - override /model: pifm.yaml
  - override /trainer: default.yaml
  - override /callbacks: default.yaml

task_name: curly_flow_pifm
tags: ["pifm", "synthetic", "curly_flow"]

optimized_metric: "val_loss"

model:
  dim: ${data.dim}
  hidden_dim: 256
  bridge_depth: 3
  product_depth: 4
  lr: 1.0e-3
  sigma: 0.01
  lambda_lb: 0.1
  use_lie_bracket: true
  bridge_warmup_steps: 500
  bridge_warmup_use_velocity_targets: true
  bridge_teacher_knn_k: 16
  # Use the analytic reference field (psi_rotation / psi_expansion) as the
  # teacher for the product model interior supervision as well.
  product_teacher_use_local_velocity: true
  product_teacher_knn_k: 64
  product_teacher_kernel: gaussian
  product_teacher_bandwidth: null
  grad_clip_norm: 1.0
  sample_steps: 100
  max_velocity_norm: null
  axis1:
    method: curly_fm
    velocity_key: null
  axis2:
    method: curly_fm
    velocity_key: null

trainer:
  max_epochs: 200

callbacks:
  model_checkpoint:
    monitor: "val_loss"
    mode: "min"
    filename: "best"
    save_last: false
    auto_insert_metric_name: false
  early_stopping:
    monitor: "val_loss"
    mode: "min"
    patience: 30
